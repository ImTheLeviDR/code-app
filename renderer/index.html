<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code app</title>
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/providers.css" />
</head>
<body class="startup-loading">
  <div id="startupLoader" class="startup-loader" aria-live="polite" aria-busy="true">
    <div class="startup-loader-inner">
      <div class="startup-loader-dots" aria-hidden="true">
        <span class="startup-loader-dot"></span>
        <span class="startup-loader-dot"></span>
        <span class="startup-loader-dot"></span>
      </div>
      <div class="startup-loader-text" id="startupLoaderText">
        <span class="thinking-typewriter-text"></span>
      </div>
    </div>
  </div>

  <div class="app">

    <!-- Custom title bar -->
    <div class="titlebar" id="titlebar">
      <div class="titlebar-left">
        <button
          type="button"
          class="titlebar-logo-wrap"
          id="titlebarLogoWrap"
          title="Toggle sidebar"
          aria-label="Toggle sidebar"
        >
          <div class="titlebar-logo">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </button>
        <nav class="titlebar-menubar" id="titlebarMenubar" role="menubar" aria-label="Application menu"></nav>
      </div>
      <div
        class="titlebar-drag-region"
        id="titlebarDragRegion"
        title="Drag to move · Double-click to maximize"
        aria-hidden="true"
      ></div>
      <div class="titlebar-right">
        <div class="titlebar-controls">
          <button class="ctrl-btn minimize-btn" id="minimizeBtn" type="button" title="Minimize" aria-label="Minimize">
            <svg width="10" height="1" viewBox="0 0 10 1" aria-hidden="true"><rect width="10" height="1" fill="currentColor"/></svg>
          </button>
          <button class="ctrl-btn maximize-btn" id="maximizeBtn" type="button" title="Maximize" aria-label="Maximize">
            <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect width="9" height="9" x=".5" y=".5" fill="none" stroke="currentColor"/></svg>
          </button>
          <button class="ctrl-btn close-btn" id="closeBtn" type="button" title="Hide to notification area" aria-label="Hide to notification area">
            <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- App body -->
    <div class="app-body" id="appBody">

      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <!-- Top nav -->
        <nav class="sidebar-nav">
          <button class="nav-item" data-action="new-chat">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
              <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            New chat
          </button>
          <button class="nav-item" data-action="search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
              <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
              <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            Search
          </button>
          <button class="nav-item" data-action="plugins">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
              <path d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9M9 21H5a2 2 0 01-2-2V9m0 0h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            Plugins
          </button>
        </nav>

        <div class="sidebar-divider"></div>

        <!-- Projects list -->
        <div class="projects-container" id="projectsContainer">
          <div class="projects-label">Projects</div>
          <div class="projects-list" id="projectsList"></div>
        </div>

        <!-- Sidebar footer -->
        <div class="sidebar-footer">
          <button class="footer-btn" data-action="settings">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
              <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="2"/>
            </svg>
            Settings
          </button>
        </div>
      </aside>

      <!-- Main content area -->
      <main class="main" id="main">

        <!-- Welcome screen -->
        <div class="welcome-screen" id="welcomeScreen" style="display:none">
          <div class="welcome-content">
            <div class="welcome-icon">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <h1 class="welcome-title" id="welcomeTitle">What should we work on?</h1>
            <p class="welcome-subtitle" id="welcomeSubtitle"></p>
          </div>
          <div class="welcome-input-area">
            <div class="input-box welcome-input-box">
              <textarea
                class="message-input"
                id="welcomeInput"
                placeholder="Try "
                rows="1"
              ></textarea>
              <div class="input-footer">
                <div class="input-footer-left">
                  <button class="input-action-btn" title="Attach file">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                      <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                  </button>
                </div>
                <div class="input-footer-right">
                  <div class="model-dropdown" id="welcomeModelDropdown"></div>
                  <button class="send-btn" id="welcomeSendBtn" disabled>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                      <path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Settings screen -->
        <div class="settings-screen" id="settingsScreen" style="display:none"></div>

        <!-- Chat screen -->
        <div class="chat-screen" id="chatScreen" style="display:none">
          <!-- Chat header -->
          <div class="chat-header" id="chatHeader">
            <div class="chat-header-left">
              <span class="chat-title" id="chatTitle">New chat</span>
            </div>
            <div class="chat-header-right">
              <button class="header-action-btn" title="Share">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                  <circle cx="18" cy="5" r="3" stroke="currentColor" stroke-width="2"/>
                  <circle cx="6" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
                  <circle cx="18" cy="19" r="3" stroke="currentColor" stroke-width="2"/>
                  <path d="M8.59 13.51l6.83 3.98M15.41 6.51L8.59 10.49" stroke="currentColor" stroke-width="2"/>
                </svg>
              </button>
              <button class="header-action-btn" title="More">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                  <circle cx="12" cy="5" r="1" fill="currentColor"/>
                  <circle cx="12" cy="12" r="1" fill="currentColor"/>
                  <circle cx="12" cy="19" r="1" fill="currentColor"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Messages list -->
          <div class="messages-list" id="messagesList"></div>

          <!-- Scroll to bottom btn -->
          <button class="scroll-to-bottom" id="scrollToBottom" style="display:none">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
              <path d="M12 5v14M5 12l7 7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <!-- Chat input -->
          <div class="chat-input-area" id="chatInputArea">
            <div class="input-box chat-input-box">
              <textarea
                class="message-input"
                id="chatInput"
                placeholder="Reply to continue..."
                rows="1"
              ></textarea>
              <div class="input-footer">
                <div class="input-footer-left">
                  <button class="input-action-btn" title="Attach file">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                      <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                  </button>
                </div>
                <div class="input-footer-right">
                  <div class="model-dropdown" id="chatModelDropdown"></div>
                  <button class="send-btn" id="chatSendBtn" disabled>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                      <path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="js/physics.js"></script>
  <script src="js/data.js"></script>
  <script src="js/backend.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/app.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/titlebar-menu.js"></script>
</body>
</html>
